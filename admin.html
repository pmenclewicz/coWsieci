<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Słowa Kluczowe - Co w Sieci</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { color: #0066cc; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea { width: 100%; height: 120px; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0066cc; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 15px; width: 100%; }
        button:hover { background-color: #0052a3; }
        .info { background: #eef6ff; border-left: 4px solid #0066cc; padding: 12px; margin-bottom: 20px; font-size: 0.9rem; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Planowanie Artykułów</h1>
    <div class="info">
        Wpisz frazy rozdzielone przecinkami. Podczas **najbliższego co-godzinnego uruchomienia** bot pobierze je, wygeneruje dla nich osobne artykuły, po czym wyczyszcza listę.
    </div>

    <form id="manual-form">
        <label for="keywords">Słowa kluczowe (po przecinku):</label>
        <textarea id="keywords" placeholder="np. Premiera gry XYZ, Wyniki wyborów, Jak usunąć plamy" required></textarea>

        <label for="token">Personal Access Token (z uprawnieniem 'repo'):</label>

        <button type="submit" id="btn-submit">Dodaj do kolejki generowania</button>
    </form>

    <div id="status"></div>

    <script>
        const REPO = "pmenclewicz/szkola";
        const FILE_PATH = "manual_keywords.txt";

        document.getElementById('manual-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const keywords = document.getElementById('keywords').value.trim();
            const token = document.getElementById('token').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('btn-submit');

            status.style.color = 'black';
            status.innerText = 'Zapisywanie w repozytorium...';
            btn.disabled = true;

            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;

            try {
                let sha = "";
                let existingContent = "";

                // Pobranie aktualnej zawartości pliku jeśli istnieje
                const getRes = await fetch(url, {
                    headers: { 'Authorization': `token ${token}` }
                });

                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                    existingContent = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                }

                // Połączenie starych i nowych fraz
                let finalContent = existingContent ? `${existingContent}, ${keywords}` : keywords;
                const contentEncoded = btoa(unescape(encodeURIComponent(finalContent)));

                const bodyData = {
                    message: "Dodano frazy do kolejki generowania",
                    content: contentEncoded
                };
                if (sha) bodyData.sha = sha;

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    status.style.color = 'green';
                    status.innerText = 'Pomyślnie dodano do kolejki! Artykuły zostaną wygenerowane przy najbliższej pełnej godzinie.';
                    document.getElementById('keywords').value = '';
                } else {
                    const errData = await putRes.json();
                    status.style.color = 'red';
                    status.innerText = 'Błąd zapisu: ' + (errData.message || 'Sprawdź token.');
                }
            } catch (err) {
                status.style.color = 'red';
                status.innerText = 'Błąd połączenia: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
