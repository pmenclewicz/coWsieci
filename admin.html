<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planowanie Artykułów - Co w Sieci</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
        h1 { color: #0066cc; border-bottom: 2px solid #0066cc; padding-bottom: 10px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        textarea, input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 100px; }
        button { background-color: #0066cc; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; margin-top: 20px; width: 100%; font-weight: bold; }
        button:hover { background-color: #0052a3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .info { background: #eef6ff; border-left: 4px solid #0066cc; padding: 12px; margin-bottom: 20px; font-size: 0.9rem; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>
    <h1>Planowanie Artykułów</h1>
    <div class="info">
        Wpisz frazy rozdzielone przecinkami. Zostaną one dodane do kolejki i przetworzone przy **najbliższej pełnej godzinie**.
    </div>

    <form id="manual-form">
        <label for="keywords">Słowa kluczowe (rozdzielone przecinkami):</label>
        <textarea id="keywords" placeholder="np. Premiera nowego smartfona, Wyniki meczu, Jak dbać o rośliny" required></textarea>

        <label for="token">Personal Access Token (z uprawnieniem 'repo'):</label>
        <input type="password" id="token" placeholder="ghp_..." required>

        <button type="submit" id="btn-submit">Dodaj do kolejki generowania</button>
    </form>

    <div id="status"></div>

    <script>
        const REPO = "pmenclewicz/szkola";
        const FILE_PATH = "manual_keywords.txt";

        document.getElementById('manual-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const keywords = document.getElementById('keywords').value.trim();
            const token = document.getElementById('token').value.trim();
            const status = document.getElementById('status');
            const btn = document.getElementById('btn-submit');

            status.style.backgroundColor = '#fff3cd';
            status.style.color = '#856404';
            status.innerText = 'Zapisywanie w repozytorium... Proszę czekać.';
            btn.disabled = true;

            const url = `https://api.github.com/repos/${REPO}/contents/${FILE_PATH}`;

            try {
                let sha = "";
                let existingContent = "";

                // 1. Pobranie aktualnej zawartości pliku z GitHuba
                const getRes = await fetch(url, {
                    headers: { 
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getRes.ok) {
                    const data = await getRes.json();
                    sha = data.sha;
                    existingContent = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
                }

                // 2. Połączenie dotychczasowych fraz z nowymi
                let finalContent = existingContent ? `${existingContent}, ${keywords}` : keywords;
                const contentEncoded = btoa(unescape(encodeURIComponent(finalContent)));

                // 3. Zapis nowego pliku do repozytorium
                const bodyData = {
                    message: "Dodano frazy do kolejki generowania",
                    content: contentEncoded
                };
                if (sha) bodyData.sha = sha;

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (putRes.ok) {
                    status.style.backgroundColor = '#d4edda';
                    status.style.color = '#155724';
                    status.innerText = ' Success! Pomyślnie dodano frazy do kolejki. Artykuły zostaną wygenerowane o najbliższej pełnej godzinie.';
                    document.getElementById('keywords').value = '';
                } else {
                    const errData = await putRes.json();
                    status.style.backgroundColor = '#f8d7da';
                    status.style.color = '#721c24';
                    status.innerText = ' Błąd zapisu: ' + (errData.message || 'Sprawdź poprawność tokenu.');
                }
            } catch (err) {
                status.style.backgroundColor = '#f8d7da';
                status.style.color = '#721c24';
                status.innerText = ' Błąd połączenia: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
