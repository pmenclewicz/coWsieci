name: Generate Articles

on:
  schedule:
    - cron: '0 */6 * * *'  # Automatyczne uruchamianie co 6 godzin
  workflow_dispatch:        # Uruchamianie na żądanie (przez API / formularz)
    inputs:
      manual_keywords:
        description: 'Słowa kluczowe rozdzielone przecinkami'
        required: false
        default: ''

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MANUAL_KEYWORDS: ${{ github.event.inputs.manual_keywords }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml *.html
          git commit -m "Automatyczne wygenerowanie nowych artykułów" || exit 0
          git push
