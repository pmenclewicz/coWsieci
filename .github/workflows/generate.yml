name: Generate Articles

on:
  schedule:
    - cron: '0 * * * *'  # Co godzinę
  workflow_dispatch:      # Uruchamianie ręczne

permissions:
  contents: write         # Kluczowe: daje botowi prawo do git push

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Pobiera pełną historię repozytorium, pomaga przy rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python bot.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml manual_keywords.txt *.html *.jpg
          git commit -m "Automatyczna publikacja wpisów i grafik AI" || exit 0
          
          # Pobranie najnowszych zmian z GitHuba przed wysłaniem nowych plików
          git pull --rebase origin main
          
          git push
