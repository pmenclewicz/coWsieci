name: Generate Articles

on:
  schedule:
    - cron: '0 * * * *'  # Uruchamianie automatyczne co pełną godzinę
  workflow_dispatch:      # Możliwość ręcznego uruchomienia przyciskiem w zakładce Actions

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Bot Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml manual_keywords.txt *.html
          git commit -m "Automatyczne wygenerowanie wpisów [co godzinę]" || exit 0
          git push
