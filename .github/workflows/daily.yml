name: Automatic Trend Publisher

on:
  schedule:
    - cron: '0 8 * * *'  # Uruchamia się codziennie o 8:00 rano
  workflow_dispatch:      # Pozwala uruchomić bota ręcznie

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Trend Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "coWsieci Bot"
          git config --global user.email "bot@coWsieci.pl"
          git add .
          git commit -m "Auto-generated daily trend page" || exit 0
          git push
